name: Verify Prebuild

on:
  workflow_dispatch:
  push:
    branches: [ "verify-prebuild" ]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Fetch rime submodules
        run: |
          git submodule update --init --depth 1             plugin/rime/src/main/cpp/rime-prelude             plugin/rime/src/main/cpp/rime-essay             plugin/rime/src/main/cpp/rime-luna-pinyin             plugin/rime/src/main/cpp/rime-stroke

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y libboost-dev libboost-regex-dev libgoogle-glog-dev             libleveldb-dev libmarisa-dev libopencc-dev libyaml-cpp-dev

      - name: Build rime_deployer 1.16.1
        env:
          GLOG_logtostderr: "1"
        run: |
          set -euo pipefail
          LIBRIME_VER=1.16.1
          cd "$RUNNER_TEMP"
          curl -sSfL -o librime.tar.gz "https://github.com/rime/librime/archive/refs/tags/${LIBRIME_VER}.tar.gz"
          tar xzf librime.tar.gz
          cmake -S "librime-${LIBRIME_VER}" -B librime-build -DCMAKE_BUILD_TYPE=Release -DBUILD_TEST=OFF
          cmake --build librime-build --target rime_deployer -j"$(nproc)"
          "$RUNNER_TEMP/librime-build/bin/rime_deployer" 2>&1 | head -5 || true

      - name: Prebuild and inspect artifacts
        env:
          GLOG_logtostderr: "1"
        run: |
          set -euo pipefail
          DEPLOYER="$RUNNER_TEMP/librime-build/bin/rime_deployer"
          SRC="$GITHUB_WORKSPACE/plugin/rime/src/main/cpp"
          OUT="$RUNNER_TEMP/rime-user"
          STAGE="$RUNNER_TEMP/rime-shared"
          rm -rf "$OUT" "$STAGE" && mkdir -p "$OUT" "$STAGE"
          cd "$SRC"
          cp default.yaml "$STAGE/"
          cp rime-prelude/key_bindings.yaml rime-prelude/punctuation.yaml rime-prelude/symbols.yaml "$STAGE/"
          cp rime-luna-pinyin/luna_pinyin.dict.yaml rime-luna-pinyin/luna_pinyin.schema.yaml \
             rime-luna-pinyin/luna_quanpin.schema.yaml rime-luna-pinyin/pinyin.yaml "$STAGE/"
          cp rime-stroke/stroke.dict.yaml rime-stroke/stroke.schema.yaml "$STAGE/"
          cp rime-essay/essay.txt "$STAGE/"
          cp rime-wugniu-suwu/*.yaml "$STAGE/"
          pip install --quiet pypinyin
          python3 "$GITHUB_WORKSPACE/scripts/gen_sogou_codes.py" "$STAGE/luna_pinyin.sogou.dict.yaml"
          cp rime-xinganhua/*.yaml "$STAGE/"
          cp -r rime-wugniu-suwu/lua "$STAGE/lua"
          "$DEPLOYER" --compile "$STAGE/luna_pinyin.sogou.schema.yaml" "$OUT" "$STAGE" "$OUT"
          "$DEPLOYER" --build "$OUT" "$STAGE" "$OUT"
          rm -f "$OUT/user.yaml" "$OUT/installation.yaml"
          echo "=== artifacts ==="
          ls -la "$OUT"
          echo "=== prism format check ==="
          for f in "$OUT"/*.prism.bin; do
            printf "%-42s %s\n" "$(basename "$f")" "$(head -c 16 "$f" | tr -d '\0')"
          done
          echo "=== table format check ==="
          for f in "$OUT"/*.table.bin; do
            printf "%-42s %s\n" "$(basename "$f")" "$(head -c 16 "$f" | tr -d '\0')"
          done
          echo "=== required files ==="
          for f in wugniu_suwu chengqyu nanjiao wugniu_lumozy luna_pinyin.sogou; do
            test -f "$OUT/$f.prism.bin" && echo "OK  $f.prism.bin" || { echo "MISSING $f.prism.bin"; exit 1; }
          done
          echo "=== deployment sanity (no user.yaml) ==="
          test ! -f "$OUT/user.yaml" && echo "OK no user.yaml"
