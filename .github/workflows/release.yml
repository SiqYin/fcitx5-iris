name: Publish Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for green build of this commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.sha }}"
          # 只认 tag 推送前后（含同一次 push 触发）创建的构建，防止把旧版本号产物挂到新 Release；
          # 发布时须分支与 tag 同一次 push，构建发生在 tag 已存在之后，APK versionName 即为 tag 本身
          CUTOFF=$(date -u -d '90 seconds ago' +%Y-%m-%dT%H:%M:%SZ)
          RUN=""
          for i in $(seq 1 60); do
            RUN=$(gh run list -R "${{ github.repository }}" --workflow build-custom.yml --status success --limit 30 \
              --json databaseId,headSha,createdAt \
              | jq -r --arg sha "$SHA" --arg cutoff "$CUTOFF" \
              '(.[] | select(.headSha == $sha and .createdAt >= $cutoff) | .databaseId) // ""')
            if [ -n "$RUN" ]; then
              echo "Found green build run: $RUN"
              break
            fi
            echo "Waiting for a green build of $SHA (attempt $i/60)..."
            sleep 120
          done
          if [ -z "$RUN" ]; then
            echo "::error::No green build-custom run found for $SHA within 2 hours (build not triggered, failed, or still running)"
            exit 1
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ steps.run.outputs.run }}" -R "${{ github.repository }}" -D artifacts

      - name: Create release and upload APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          cat > notes.md <<'NOTES'
          ## 小鸢输入法 Iris Keyboard

          基于上游 [fcitx5-android](https://github.com/fcitx5-android/fcitx5-android) 的独立发行版，
          四个 Rime 方案全部内置于同一个 APK：

          | 方案 | 说明 | 来源 |
          |---|---|---|
          | 吴语·苏沪混合腔（wugniu_suwu） | 全量搜狗词表 | [wugniu_suwu](https://github.com/SiqYin/wugniu_suwu) |
          | 吴语拼音文（wugniu_lumozy） | 汉字 ⇄ 拼音文 | 同上 |
          | 西安话·城区音（chengqyu） | `` ` `` 普通话反查、全量搜狗词表 | [android-xinganhua](https://github.com/SiqYin/android-xinganhua) |
          | 西安话·南郊音（nanjiao） | 同上 | 同上 |

          ## 两个版本，内容相同

          本次发布提供两个发行版，**包内方案完全一致（都是上面四个）**，区别只有默认方案：

          | 版本 | 包名 | 默认方案 |
          |---|---|---|
          | **吴语版** `iris-wugniu` | `io.github.siqyin.iris.wugniu` | 吴语·苏沪混合腔 |
          | **西安话版** `iris-xinganhua` | `io.github.siqyin.iris.xinganhua` | 西安话·南郊音 |

          两个包名不同，可以同时安装、互不覆盖，按需任选其一即可。

          **开箱即用**：词库已在构建机上预编译，安装激活后第一次调出键盘会**自动完成部署**，
          不需要手动点「部署」。

          **输入法**：只有 **Rime（中州韵，默认）** 与 **English** 两个；
          自然码、五笔字型、五笔拼音、电报码等码表输入法不随包分发。

          **更新提醒**：有新版本时会在手机上收到一条通知，点通知里的「更新」即可前往下载页；
          同一版本只提醒一次。

          ## 安装

          1. 在下面的文件里选**一个版本**（吴语版或西安话版），再选与本机 ABI 对应的 APK
             （一般手机选 **arm64-v8a**）；
          2. 安装后打开应用，按引导在系统设置里启用并切换到「小鸢输入法」；
          3. 直接输入。方案菜单在键盘上按 `Ctrl+`` 或 F4（软键盘长按菜单）切换。
          NOTES
          gh release create "$TAG" -R "${{ github.repository }}" --title "小鸢输入法 Iris Keyboard $TAG" --notes-file notes.md
          find artifacts -name "*.apk" -print0 | xargs -0 gh release upload "$TAG" -R "${{ github.repository }}" --clobber
