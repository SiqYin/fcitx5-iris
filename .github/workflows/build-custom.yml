name: Build Custom APK

on:
  push:
    branches: [ "master", "main", "build/*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      # versionName 必须在构建时确定，且与 Release tag 一致：
      #  - tag 推送上来的构建：直接用 tag（去掉 v 前缀，如 v1.0.0 → 1.0.0）
      #  - 普通分支构建：用 git describe（如 v1.0.0 / v1.0.0-3-gabc1234），也去掉 v
      # 之前依赖 build-logic 里的 `git describe --tags`，一旦在打 tag 之前构建，
      # versionName 就会变成 `v0.1.1-2-g2c06612` 这种非发布形态，且带 v 前缀会让
      # 应用内「更新检测」的语义化比较失效。
      - name: Resolve version name
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RAW="${GITHUB_REF#refs/tags/}"
          else
            RAW="$(git describe --tags --always)"
          fi
          VERSION="${RAW#v}"
          VERSION="${VERSION#V}"
          echo "versionName=$VERSION" >> "$GITHUB_OUTPUT"
          echo "resolved versionName=$VERSION (from $RAW)"

      - name: Setup Android environment
        uses: android-actions/setup-android@v4
        with:
          packages: cmake;3.31.6

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install extra-cmake-modules gettext \
            libboost-dev libboost-regex-dev libboost-iostreams-dev libboost-system-dev \
            libgoogle-glog-dev libleveldb-dev libmarisa-dev libopencc-dev libyaml-cpp-dev

      # 预编译 Rime 词库：在构建机上（对齐 prebuilt 子模块的 librime 1.12.0）
      # 用 rime_deployer 把 4 个方案与全部词典编译成 table/prism/reverse 产物，
      # 连同 .buildinfo 版本戳打进 APK assets（usr/share/rime-data/build/，
      # 即 librime 的 prebuilt_data_dir）。手机端启动时直接加载，
      # 免手动部署、免在手机上编译——这也是大词表能放回包里的前提。
      - name: Prebuild Rime dictionaries
        env:
          GLOG_logtostderr: "1"
          GLOG_colorlogtostderr: "1"
        run: |
          set -euo pipefail
          # 必须与 lib/fcitx5/src/main/cpp/prebuilt 子模块里的 librime 完全同版本。
          # 预编译产物（table/prism/reverse 二进制）的格式随 librime 版本变化：
          #   1.12.x 写 Prism/3.0；1.16.x 要求 Prism >= 4.0，读到 3.0 直接判
          #   "too old" 并拒绝加载 → 运行时 dict->loaded() 恒为 false → 任何键都不出字。
          # prebuilt（fcitx5-android/prebuilt，commit 3f987c6）打包的是 1.16.1。
          LIBRIME_VER=1.16.1
          cd "$RUNNER_TEMP"
          curl -sSfL -o librime.tar.gz "https://github.com/rime/librime/archive/refs/tags/${LIBRIME_VER}.tar.gz"
          tar xzf librime.tar.gz
          cmake -S "librime-${LIBRIME_VER}" -B librime-build -DCMAKE_BUILD_TYPE=Release -DBUILD_TEST=OFF
          cmake --build librime-build --target rime_deployer -j"$(nproc)"
          DEPLOYER="$RUNNER_TEMP/librime-build/bin/rime_deployer"
          test -x "$DEPLOYER" && echo "rime_deployer: $DEPLOYER"
          SRC="$GITHUB_WORKSPACE/plugin/rime/src/main/cpp"
          OUT="$RUNNER_TEMP/rime-user"
          rm -rf "$OUT" && mkdir -p "$OUT"
          # 搭建平铺的 shared_data staging（模拟 CMake install 后的 rime-data 布局，
          # rime_deployer 的 config_compiler 只在 shared_data_dir 根找 __include 资源）
          STAGE="$RUNNER_TEMP/rime-shared"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cd "$SRC"
          cp default.yaml "$STAGE/"
          cp rime-prelude/key_bindings.yaml rime-prelude/punctuation.yaml rime-prelude/symbols.yaml "$STAGE/"
          cp rime-luna-pinyin/luna_pinyin.dict.yaml rime-luna-pinyin/luna_pinyin.schema.yaml \
             rime-luna-pinyin/luna_quanpin.schema.yaml rime-luna-pinyin/pinyin.yaml "$STAGE/"
          cp rime-stroke/stroke.dict.yaml rime-stroke/stroke.schema.yaml "$STAGE/"
          cp rime-essay/essay.txt "$STAGE/"
          cp rime-wugniu-suwu/*.yaml "$STAGE/"
          # 上游搜狗表是纯汉字词条（无拼音列），独立编译时无法走 CreateEntry：
          # 用 pypinyin 生成 luna_pinyin 风格码列（无声调、v 代 ü），
          # 仅生成到 staging，仓库内保持上游原样
          pip install --quiet pypinyin
          python3 "$GITHUB_WORKSPACE/scripts/gen_sogou_codes.py" "$STAGE/luna_pinyin.sogou.dict.yaml"
          cp rime-xinganhua/*.yaml "$STAGE/"
          cp -r rime-wugniu-suwu/lua "$STAGE/lua"
          # 先单独 verbose 编译共享搜狗词库（依赖/错误细节都打出来；
          # 产物留在 staging，后续 --build 会经 checksum 对比直接复用）
          "$DEPLOYER" --compile "$STAGE/luna_pinyin.sogou.schema.yaml" "$OUT" "$STAGE" "$OUT"
          # --build [user_data_dir] [shared_data_dir] [staging_dir]
          # staging_dir 即产物目录本身（librime 直接往里写编译产物）
          "$DEPLOYER" --build "$OUT" "$STAGE" "$OUT"
          rm -f "$OUT/user.yaml" "$OUT/installation.yaml"
          ls -la "$OUT"
          mkdir -p "$SRC/rime-wugniu-suwu/build"
          cp -a "$OUT/." "$SRC/rime-wugniu-suwu/build/"
          HASH=$(
            ( cd "$SRC" && find . -path './rime-wugniu-suwu/build' -prune -o -name '*.yaml' -print \
              | LC_ALL=C sort | xargs sha256sum ) | sha256sum | cut -d' ' -f1)
          printf 'schema=%s\nlibrime=%s\ndate=%s\n' "$HASH" "$LIBRIME_VER" "$(date -u +%FT%TZ)" \
            > "$SRC/rime-wugniu-suwu/build/buildinfo.txt"
          ls -la "$SRC/rime-wugniu-suwu/build"

      # 一次构建两个发行版：iris-wugniu（默认吴语混合腔）与 iris-xinganhua（默认西安话南郊音）。
      # 两者内容完全一致（同一棵树、同样四个方案），只是 applicationId 与默认方案不同，
      # 故可并存安装。每个 flavor × 4 ABI = 8 个 APK。
      - name: Build Release APK
        shell: bash
        env:
          SIGN_KEY_BASE64: ${{ secrets.SIGN_KEY_BASE64 }}
          SIGN_KEY_PWD: ${{ secrets.SIGN_KEY_PWD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          BUILD_VERSION_NAME: ${{ steps.ver.outputs.versionName }}
        run: |
          set -o pipefail
          if [ -z "$SIGN_KEY_BASE64" ]; then
            echo "::error::SIGN_KEY_BASE64 未配置，release 产物将无法签名"
            exit 1
          fi
          ./gradlew :app:assembleWugniuRelease :app:assembleXinganhuaRelease 2>&1 | tee build-main.log

      - name: Verify APKs are signed
        shell: bash
        run: |
          set -e
          UNSIGNED=$(find app/build/outputs/apk -name "*-unsigned.apk" 2>/dev/null | head -5)
          if [ -n "$UNSIGNED" ]; then
            echo "::error::发现未签名产物：$UNSIGNED"
            exit 1
          fi
          for f in wugniu xinganhua; do
            n=$(find "app/build/outputs/apk/$f/release" -name '*.apk' 2>/dev/null | wc -l)
            echo "$f 已签名 APK 数量：$n"
            if [ "$n" -ne 4 ]; then
              echo "::error::$f 应有 4 个 ABI APK，实际 $n"
              exit 1
            fi
          done
          echo "总计：$(find app/build/outputs/apk -path '*/release/*.apk' | wc -l) 个 APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: iris-keyboard-apk
          path: app/build/outputs/apk/*/release/

      - name: Save failure log to ci-logs branch
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/cilog
          tail -c 300000 build-main.log > /tmp/cilog/build-main.log 2>/dev/null || true
          cd /tmp/cilog
          if [ ! -s build-main.log ]; then exit 0; fi
          git init -q
          git config user.email "ci-bot@users.noreply.github.com"
          git config user.name "ci-log-bot"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git checkout -q -B ci-logs
          git add -A
          git commit -q -m "ci failure log for ${{ github.sha }}" || true
          git push -q -f origin ci-logs
